<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>info</title>

<link rel="icon" type="image/gif" href="Images/luna.gif">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div id="depthLayer"></div>
<div class="wavy-background"></div>

<div class="page-grid">
  <section class="profile-card">
    <div class="profile-header">
      <div class="avatar-wrap">
        <img class="profile" src="Images/luna.gif" alt="cry avatar">
      </div>
      <span class="profile-badge">profile</span>
      <span class="status-pill" id="discordStatusPill" data-status="offline">
        <span class="status-dot" id="discordStatusDot"></span>
        <span id="discordStatusText">offline</span>
      </span>
      <h1>info</h1>
      <div class="profile-subtext">links and such</div>
    </div>
    <div class="widget-stack">
      <div class="steam-widget">
        <img id="steamArtwork" class="steam-artwork" src="Images/steam.webp" alt="Steam artwork">
        <div class="steam-info">
          <div class="steam-status" id="steamStatus">steam loading...</div>
          <div class="steam-game" id="steamGame">fetching steam data…</div>
          <div class="steam-detail" id="steamDetail"></div>
        </div>
        <a class="steam-link" id="steamLink" href="https://steamcommunity.com/id/cry_tals" target="_blank" rel="noreferrer noopener" title="Steam" aria-label="Steam">
          <img src="Images/steam.webp" alt="Steam">
        </a>
      </div>
      <div class="lastfm-widget">
        <img id="lastfmArtwork" class="lastfm-artwork" src="Images/lastfm.png" alt="Last.fm artwork">
        <div class="lastfm-info">
          <div class="lastfm-status" id="lastfmStatus">last.fm loading...</div>
          <div class="lastfm-track" id="lastfmTrack">fetching your latest track…</div>
          <div class="lastfm-artist" id="lastfmArtist"></div>
        </div>
        <a class="lastfm-link" href="https://last.fm/user/crystalvxs" target="_blank" rel="noreferrer noopener" title="Last.fm" aria-label="Last.fm">
          <img src="Images/lastfm.png" alt="Last.fm">
        </a>
      </div>
    </div>
  </section>

  <section class="link-card">
    <div class="card-header">
      <span class="card-badge">links</span>
      <h2>Where to find me</h2>
    </div>
    <div class="buttons">
      <a href="https://steamcommunity.com/id/cry_tals" target="_blank">
        <img src="Images/steam.webp" alt="Steam">
        <div>
          <div class="linkLabel">cry_tals</div>
          <div class="linkSubtext">Steam</div>
        </div>
      </a>
      <a href="https://discord.com/users/955250582078238730" target="_blank">
        <img src="Images/discord.webp" alt="Discord">
        <div>
          <div class="linkLabel">cry_tals</div>
          <div class="linkSubtext">Discord</div>
        </div>
      </a>
      <a href="https://www.tiktok.com/@cry_tals" target="_blank">
        <img src="Images/tiktok.webp" alt="TikTok">
        <div>
          <div class="linkLabel">cry_tals</div>
          <div class="linkSubtext">TikTok</div>
        </div>
      </a>
      <a href="https://www.roblox.com/users/679387671/profile" target="_blank">
        <img src="Images/roblox.webp" alt="Roblox">
        <div>
          <div class="linkLabel">cry_tals</div>
          <div class="linkSubtext">Roblox</div>
        </div>
      </a>
      <a href="https://last.fm/user/crystalvxs" target="_blank">
        <img src="Images/lastfm.png" alt="Last.fm">
        <div>
          <div class="linkLabel">crystalvxs</div>
          <div class="linkSubtext">Last.fm</div>
        </div>
      </a>
    </div>
  </section>
</div>

<img id="easter-egg-tree" src="Images/tree.webp" alt="Tree">
<img id="easter-egg-man" src="Images/man.png" alt="Man">
<img id="easter-egg-man2" src="Images/man2.png" alt="Man2">
<img id="easter-egg-man3" src="Images/man3.png" alt="Man3">
<audio id="music" autoplay loop></audio>
<audio id="egg-sound"></audio>
<script src="js/main.js"></script>
</body>
</html>
